name: Update site

on:
  schedule:
    # 05:17 UTC daily. Off the hour on purpose: GitHub queues cron jobs that
    # land exactly on the hour, so they fire late.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roster
  cancel-in-progress: false

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild roster and write news about what changed
        run: python3 scripts/update_site.py

      - name: Tell Discord about it
        # No-ops when the secret is missing, and never fails the job: the site
        # is what matters, Discord is a bonus.
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/post_news_to_discord.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed. No commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update roster and news from armory"
          git push
